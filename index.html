<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ディズニーアトラクションガイド</title>
<style>
    :root {
        --bg: #0f1a33;
        --card: #16213f;
        --card-border: #27345c;
        --accent: #f4c95d;
        --accent-dim: #caa23f;
        --text: #eef1fb;
        --text-dim: #9aa6c7;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 20% 0%, #1c2b52 0%, var(--bg) 55%);
        color: var(--text);
        font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
        padding: 32px 16px 60px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 32px; }
    header h1 {
        font-size: 1.7rem;
        margin: 0 0 8px;
        background: linear-gradient(90deg, var(--accent), #ffe9b0);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    header p { color: var(--text-dim); font-size: 0.85rem; margin: 0; }

    .list { display: flex; flex-direction: column; gap: 14px; }

    .pdf-card {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 16px 18px;
        text-decoration: none;
        color: var(--text);
        transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .pdf-card:hover {
        border-color: var(--accent-dim);
        background: #1b2748;
        transform: translateY(-2px);
    }
    .pdf-icon {
        flex: 0 0 auto;
        width: 42px; height: 42px;
        border-radius: 10px;
        background: #3a2f12;
        color: var(--accent);
        display: flex; align-items: center; justify-content: center;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: .5px;
        border: 1px solid var(--accent-dim);
    }
    .pdf-info { flex: 1 1 auto; min-width: 0; }
    .pdf-title {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .pdf-file {
        font-size: 0.75rem;
        color: var(--text-dim);
        font-family: ui-monospace, Consolas, monospace;
    }
    .pdf-arrow { flex: 0 0 auto; color: var(--accent); font-size: 1.1rem; }

    .area-group { margin-bottom: 26px; }
    .area-heading {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--accent);
        margin: 0 0 10px 2px;
        padding-left: 10px;
        border-left: 4px solid var(--accent-dim);
    }

    .state-msg {
        text-align: center;
        color: var(--text-dim);
        font-size: 0.9rem;
        padding: 30px 10px;
    }
    .state-msg.error { color: #ff9b9b; }

    footer {
        text-align: center;
        margin-top: 36px;
        font-size: 0.75rem;
        color: var(--text-dim);
    }
    footer a { color: var(--accent-dim); }
</style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>ディズニーアトラクションガイド</h1>
            <p>azumath30.github.io/dsny の PDF 一覧</p>
        </header>

        <div id="list" class="list">
            <div class="state-msg" id="stateMsg">読み込み中...</div>
        </div>

        <footer>
            <a href="https://github.com/azumath30/dsny" target="_blank" rel="noopener">GitHub リポジトリを見る</a>
        </footer>
    </div>

<script>
    // リポジトリ直下にPDFを置くだけで、このページの一覧にも自動で表示されます。
    const OWNER = 'azumath30';
    const REPO  = 'dsny';
    const PAGES_BASE = `https://${OWNER}.github.io/${REPO}/`;
    const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;

    // ファイル名の接頭辞（例: tl-27.pdf の "tl"）→ パークのエリア名。
    // ファイル名から自動判定するので、同じ命名規則でPDFを増やすだけで自動的にグループ分けされます。
    const AREA_NAMES = {
        wb: 'ワールドバザール',
        al: 'アドベンチャーランド',
        wl: 'ウエスタンランド',
        cc: 'クリッターカントリー',
        fl: 'ファンタジーランド',
        tt: 'トゥーンタウン',
        tl: 'トゥモローランド',
    };
    // 表示順（パークの実際の並び順）。最後に、どの接頭辞にも当てはまらないファイルをまとめる。
    const AREA_ORDER  = ['wb', 'al', 'wl', 'cc', 'fl', 'tt', 'tl'];
    const OTHER_KEY   = 'other';
    const OTHER_LABEL = 'マップ・その他';

    function classify(name) {
        const m = name.match(/^([a-z]{2})-(\d+)\.pdf$/i);
        if (m && AREA_NAMES[m[1].toLowerCase()]) {
            return { area: m[1].toLowerCase(), num: parseInt(m[2], 10) };
        }
        return { area: OTHER_KEY, num: 0 };
    }

    const listEl = document.getElementById('list');
    const stateMsgEl = document.getElementById('stateMsg');

    function renderPdfs(files) {
        listEl.innerHTML = '';

        if (files.length === 0) {
            listEl.innerHTML = '<div class="state-msg">まだPDFがありません</div>';
            return;
        }

        // エリアごとにグループ分け
        const groups = {};
        for (const file of files) {
            const { area, num } = classify(file.name);
            (groups[area] ||= []).push({ name: file.name, num });
        }

        const order = [...AREA_ORDER, OTHER_KEY];
        for (const area of order) {
            const items = groups[area];
            if (!items || items.length === 0) continue;
            items.sort((a, b) => a.num - b.num || a.name.localeCompare(b.name));

            const section = document.createElement('div');
            section.className = 'area-group';

            const heading = document.createElement('div');
            heading.className = 'area-heading';
            heading.textContent = AREA_NAMES[area] || OTHER_LABEL;
            section.appendChild(heading);

            for (const item of items) {
                const a = document.createElement('a');
                a.className = 'pdf-card';
                a.href = PAGES_BASE + encodeURIComponent(item.name);
                a.target = '_blank';
                a.rel = 'noopener';

                const title = area === OTHER_KEY
                    ? item.name.replace(/\.pdf$/i, '')
                    : `No. ${item.num}`;

                a.innerHTML = `
                    <span class="pdf-icon">PDF</span>
                    <span class="pdf-info">
                        <span class="pdf-title">${title}</span><br>
                        <span class="pdf-file">${item.name}</span>
                    </span>
                    <span class="pdf-arrow">&rarr;</span>
                `;
                section.appendChild(a);
            }

            listEl.appendChild(section);
        }
    }

    async function loadPdfList() {
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
            const items = await res.json();
            const pdfs = items
                .filter(it => it.type === 'file' && it.name.toLowerCase().endsWith('.pdf'))
                .sort((a, b) => a.name.localeCompare(b.name));
            renderPdfs(pdfs);
        } catch (err) {
            console.error(err);
            stateMsgEl.textContent = '一覧の取得に失敗しました。時間をおいて再読み込みしてください。';
            stateMsgEl.classList.add('error');
        }
    }

    loadPdfList();
</script>
</body>
</html>
